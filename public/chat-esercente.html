<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTANTOWN — Dashboard Messaggi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --rosso:#8B1A1A;--rosso-l:#C0392B;
  --ocra:#C8860A;--ocra-l:#E8A020;--ocra-p:#FDF3DC;--ocra-d:#8B5A05;
  --ink:#1C1410;--ink-m:#3D2E24;--ink-mu:#6B5A4E;
  --bianco:#FDFAF4;--rule:rgba(139,26,26,0.10);--cielo-p:#E8F4FB;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cielo-p);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

.header{background:#FFFFFF;border-bottom:1px solid var(--rule);padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(28,20,16,.04);}
.header img{width:36px;height:36px;border-radius:8px;}
.header-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--ink);flex:1;}
.header-negozio{font-size:12px;color:var(--ocra-d);margin-top:1px;}
.header-back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--ocra-p);border:1px solid rgba(200,134,10,.3);border-radius:50%;color:var(--ocra-d);font-size:22px;text-decoration:none;flex-shrink:0;transition:background .2s;}
.header-back:hover{color:var(--ocra-d);border-color:var(--ocra-l);}

/* LOGIN */
#login-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px;}
.login-box{background:rgba(28,20,16,.04);border:1px solid rgba(200,134,10,.2);border-radius:16px;padding:36px 32px;max-width:380px;width:100%;text-align:center;}
.login-icon{font-size:48px;margin-bottom:16px;}
.login-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--ink);margin-bottom:8px;}
.login-desc{font-size:13px;color:rgba(28,20,16,.5);line-height:1.6;margin-bottom:24px;}
.login-input{width:100%;background:#FFFFFF;border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:18px;color:var(--ink);font-family:'DM Sans',sans-serif;letter-spacing:.15em;text-align:center;outline:none;transition:border .2s;}
.login-input:focus{border-color:var(--ocra-l);}
.login-input::placeholder{color:rgba(28,20,16,.25);letter-spacing:.05em;}
.login-btn{width:100%;margin-top:14px;background:var(--ocra);color:#1C1410;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s;}
.login-btn:hover{background:var(--ocra-l);}
.login-error{color:#ff6b6b;font-size:12px;margin-top:10px;display:none;}
.login-retry-note{color:rgba(28,20,16,.4);font-size:11px;margin-top:8px;display:none;}

/* DASHBOARD */
#dashboard{flex:1;display:none;flex-direction:row;}

/* LISTA CHAT */
.chat-list{width:300px;border-right:1px solid rgba(200,134,10,.15);overflow-y:auto;flex-shrink:0;}
.chat-list-header{padding:16px 20px;border-bottom:1px solid rgba(200,134,10,.15);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(28,20,16,.35);}
.chat-item{padding:16px 20px;border-bottom:1px solid rgba(28,20,16,.04);cursor:pointer;transition:background .15s;}
.chat-item:hover{background:rgba(28,20,16,.04);}
.chat-item.active{background:rgba(200,134,10,.08);border-left:3px solid var(--ocra);}
.chat-item-tx{font-size:13px;font-weight:500;color:var(--ocra-d);margin-bottom:4px;}
.chat-item-msg{font-size:12px;color:rgba(28,20,16,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-item-time{font-size:10px;color:rgba(28,20,16,.25);margin-top:4px;}
.badge-new{display:inline-block;background:var(--rosso-l);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:6px;}
.no-chats{padding:40px 20px;text-align:center;color:rgba(28,20,16,.25);font-size:13px;}
.richiesta-card{padding:14px 20px;border-bottom:1px solid rgba(28,20,16,.04);background:rgba(200,134,10,.05);}
.richiesta-card-budget{font-size:14px;font-weight:600;color:var(--ocra-d);margin-bottom:2px;}
.richiesta-card-dist{font-size:11px;color:rgba(28,20,16,.4);margin-bottom:6px;}
.richiesta-card-note{font-size:12px;color:rgba(28,20,16,.5);margin-bottom:8px;}
.richiesta-propose-row{display:flex;gap:6px;}
.richiesta-input{flex:1;background:#FFFFFF;border:1px solid rgba(200,134,10,.4);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--ink);font-family:'DM Sans',sans-serif;outline:none;}
.richiesta-propose-btn{background:var(--ocra);color:#1C1410;border:none;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.richiesta-inviata{font-size:11px;color:#4caf50;font-weight:600;}
.prenotazione-accettata-card{padding:14px 20px;border-bottom:1px solid rgba(28,20,16,.04);background:rgba(46,125,50,.06);}
.prenotazione-accettata-prezzo{font-size:14px;font-weight:600;color:#2e7d32;margin-bottom:4px;}
.prenotazione-accettata-nota{font-size:11px;color:rgba(28,20,16,.45);margin-bottom:8px;}
.btn-genera-qr-hotel{width:100%;background:#2e7d32;color:#fff;border:none;border-radius:6px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-genera-qr-hotel:disabled{background:rgba(46,125,50,.4);cursor:not-allowed;}
.prenotazione-qr-ok{font-size:11px;color:#2e7d32;font-weight:600;}

/* AREA CHAT */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-area-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(28,20,16,.2);font-size:13px;gap:8px;}
.chat-area-empty-icon{font-size:40px;}
.chat-area-header{padding:14px 20px;border-bottom:1px solid rgba(200,134,10,.15);display:flex;align-items:center;justify-content:space-between;}
.chat-area-tx{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:75%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.5;}
.msg-cliente{background:#E3F0D8;color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;}
.msg-esercente{background:#8BC34A;color:#1C1410;align-self:flex-end;border-bottom-right-radius:4px;}
.msg-sistema{background:rgba(139,26,26,.2);color:rgba(28,20,16,.6);align-self:center;font-size:12px;text-align:center;border-radius:20px;padding:6px 14px;}
.msg-time{font-size:10px;opacity:.6;margin-top:4px;}
.msg-esercente .msg-time{text-align:right;color:rgba(28,20,16,.85);opacity:1;}
.chat-input-bar{background:#FFFFFF;border-top:1px solid var(--rule);padding:14px 16px;display:flex;gap:10px;align-items:flex-end;}
.chat-input{flex:1;background:#FFFFFF;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink);font-family:'DM Sans',sans-serif;resize:none;outline:none;min-height:44px;max-height:120px;transition:border .2s;}
.chat-input:focus{border-color:var(--ocra-l);}
.chat-input::placeholder{color:rgba(28,20,16,.25);}
.send-btn{background:var(--ocra);color:#1C1410;border:none;border-radius:10px;width:44px;height:44px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.send-btn:hover{background:var(--ocra-l);}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(28,20,16,.2);border-top-color:var(--ocra-l);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* TRATTATIVA */
.msg-proposta{max-width:80%;border-radius:12px;padding:12px 16px;font-size:14px;}
.msg-proposta.da-esercente{align-self:flex-end;background:#7CB342;color:#1C1410;border:1px solid #9CCC65;border-bottom-right-radius:4px;}
.msg-proposta.da-cliente{align-self:flex-start;background:#DCEDC8;color:var(--ink);border:1px solid #C5E1A5;border-bottom-left-radius:4px;}
.msg-proposta-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:4px;}
.msg-proposta-amount{font-size:20px;font-weight:600;}
.msg-proposta.da-esercente .msg-proposta-amount{color:#1C1410;}
.msg-proposta.da-cliente .msg-proposta-amount{color:#2D5A14;}
.msg-proposta-nota{font-size:12px;font-style:italic;margin-top:6px;}
.msg-proposta.da-esercente .msg-proposta-nota{color:rgba(28,20,16,.75);}
.msg-proposta.da-cliente .msg-proposta-nota{color:rgba(28,20,16,.65);}
.msg-proposta-actions{display:flex;gap:8px;margin-top:10px;}
.msg-proposta-actions button{flex:1;border:none;border-radius:6px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-pr-accetta{background:#2e7d32;color:#fff;}
.btn-pr-rifiuta{background:rgba(139,26,26,.5);color:#fff;}
.btn-pr-rilancia{background:#FFFFFF;color:var(--ink);border:1px solid rgba(28,20,16,.25);}
.msg-proposta-scaduta{opacity:.4;}
.msg-proposta-stato{font-size:11px;margin-top:6px;font-weight:600;}
.msg-proposta-stato.accettata{color:#1a5c1a;}
.msg-proposta-stato.rifiutata{color:#8b1a1a;}
.msg-proposta.da-cliente .msg-proposta-stato.accettata{color:#4caf50;}
.msg-proposta.da-cliente .msg-proposta-stato.rifiutata{color:#ff6b6b;}
.msg-proposta.da-esercente .msg-proposta-stato.scaduta{color:rgba(28,20,16,.65);}
.msg-proposta.da-cliente .msg-proposta-stato.scaduta{color:rgba(28,20,16,.4);}
.btn-genera-qr{display:block;width:100%;margin-top:8px;background:#2e7d32;color:#fff;border:none;
  border-radius:6px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-genera-qr:disabled{background:rgba(46,125,50,.4);cursor:not-allowed;}
.msg-proposta-qr-ok{font-size:12px;color:#2e7d32;font-weight:600;margin-top:6px;}
.msg-proposta-countdown{font-size:10px;margin-top:4px;}
.msg-proposta.da-esercente .msg-proposta-countdown{color:rgba(28,20,16,.65);}
.msg-proposta.da-cliente .msg-proposta-countdown{color:rgba(28,20,16,.45);}
.rilancia-panel{background:rgba(28,20,16,.06);border:1px solid rgba(200,134,10,.3);border-radius:8px;padding:10px;margin-top:8px;display:none;}
.rilancia-panel.open{display:block;}
.rilancia-input-row{display:flex;gap:6px;}
.rilancia-nota-input{width:100%;background:#FFFFFF;border:1px solid rgba(200,134,10,.4);border-radius:6px;padding:7px 9px;font-size:12px;color:var(--ink);font-family:'DM Sans',sans-serif;outline:none;margin-top:6px;}
.rilancia-input{flex:1;background:#FFFFFF;border:1px solid rgba(200,134,10,.4);border-radius:6px;padding:8px 10px;font-size:14px;color:var(--ink);font-family:'DM Sans',sans-serif;outline:none;}
.rilancia-send{background:var(--ocra);color:#1C1410;border:none;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}

@media(max-width:600px){
  #dashboard{flex-direction:column;}
  .chat-list{width:100%;max-height:200px;border-right:none;border-bottom:1px solid rgba(200,134,10,.15);}
}
</style>
</head>
<body>

<div class="header">
  <img src="Nuovo_logo_3_diss.png" onerror="this.src='icon-192.png'" alt="INSTANTOWN">
  <div style="flex:1;">
    <div class="header-title">Dashboard Messaggi</div>
    <div class="header-negozio" id="header-negozio"></div>
  </div>
  <a href="index.html#esercente" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--ocra-p);border:2px solid rgba(200,134,10,.3);border-radius:50%;color:var(--ocra-d);font-size:24px;font-weight:bold;text-decoration:none;flex-shrink:0;box-shadow:0 1px 4px rgba(28,20,16,.08);">&#8592;</a>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">🏪</div>
    <div class="login-title">Accesso esercente</div>
    <div class="login-desc">Inserisci il tuo PIN per vedere i messaggi dei clienti.</div>
    <input class="login-input" id="pin-input" type="password" placeholder="PIN" maxlength="10" autocomplete="off">
    <button class="login-btn" onclick="accediDashboard()">Accedi →</button>
    <div class="login-error" id="login-error">PIN non trovato. Controlla e riprova.</div>
    <div class="login-retry-note" id="login-retry-note">Verifica in corso, un attimo…</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="chat-list" id="chat-list">
    <div class="chat-list-header" id="prenotazioni-accettate-header" style="display:none;">✅ Prenotazioni accettate dal cliente</div>
    <div id="prenotazioni-accettate-list"></div>
    <div class="chat-list-header" id="richieste-reverse-header" style="display:none;">🏨 Richieste alloggio vicine</div>
    <div id="richieste-reverse-list"></div>
    <div class="chat-list-header">Conversazioni</div>
    <div class="no-chats" id="no-chats">Nessun messaggio ancora.</div>
  </div>
  <div class="chat-area" id="chat-area">
    <div class="chat-area-empty" id="chat-area-empty">
      <div class="chat-area-empty-icon">💬</div>
      <div>Seleziona una conversazione</div>
    </div>
    <div id="chat-active" style="display:none;flex:1;flex-direction:column;">
      <div class="chat-area-header">
        <div class="chat-area-tx" id="active-tx"></div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="chat-input-bar">
        <textarea class="chat-input" id="msg-input" placeholder="Rispondi al cliente..." rows="1"></textarea>
        <button class="send-btn" onclick="inviaMsgEsercente()">➤</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, getDocs, getDoc, doc, updateDoc, setDoc, serverTimestamp, collectionGroup, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyBez4L85HA1__NPKOzagfmKeoGLniIQeAc",
  authDomain: "instantown-app.firebaseapp.com",
  projectId: "instantown-app",
  storageBucket: "instantown-app.firebasestorage.app",
  messagingSenderId: "469598782572",
  appId: "1:469598782572:web:7fc20afb17a3c3c6d68449",
  measurementId: "G-D45LJHDDXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkkLUMGYiPXLMAozZgbWaMZoG-oKfj5chDCXus2bsrienwjPD9YcTRH3o8FVksX24L/exec';

let negozioCorrente = null;
let negozioLat = null;
let negozioLon = null;
let currentTX = null;
let unsubMessages = null;
let unsubChats = null;
let unsubRichiesteReverse = null;

// ── Verifica PIN con retry automatico + cache-busting ──
// Google Apps Script può occasionalmente restituire una risposta di
// fallback ("Script attivo") invece del risultato reale, specie subito
// dopo un ridispiegamento o per instabilità infrastrutturale lato Google.
// Ritentiamo fino a 3 volte con backoff progressivo prima di arrendersi.
async function verificaPinConRetry(pin, tentativi = 3) {
  for (let i = 0; i < tentativi; i++) {
    try {
      const url = `${APPS_SCRIPT_URL}?azione=verificaPin&pin=${encodeURIComponent(pin)}&t=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      const risposta = await res.json();
      if (risposta.stato === 'ok' && risposta.negozio) {
        return risposta;
      }
      // Risposta di fallback o PIN non valido: se non è l'ultimo tentativo, riprova
      if (i < tentativi - 1) {
        await new Promise(r => setTimeout(r, 800 * (i + 1))); // 800ms, 1600ms
        continue;
      }
      return risposta; // ultimo tentativo, restituisci quello che c'è (probabile PIN errato)
    } catch (err) {
      if (i === tentativi - 1) throw err;
      await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
  }
}

window.accediDashboard = async function() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;

  const btn = document.querySelector('.login-btn');
  const retryNote = document.getElementById('login-retry-note');
  btn.innerHTML = '<span class="loading"></span>';
  btn.disabled = true;
  document.getElementById('login-error').style.display = 'none';
  retryNote.style.display = 'block';

  try {
    const risposta = await verificaPinConRetry(pin, 3);
    retryNote.style.display = 'none';

    if (risposta.stato !== 'ok' || !risposta.negozio) {
      document.getElementById('login-error').style.display = 'block';
      btn.innerHTML = 'Accedi →';
      btn.disabled = false;
      return;
    }

    const trovato = risposta.negozio;

    negozioCorrente = trovato.nome;
    negozioLat = trovato.lat;
    negozioLon = trovato.lon;
    document.getElementById('header-negozio').textContent = trovato.nome;

    // ── Firebase Auth silenzioso per esercente ──
    // Email sintetica basata sul PIN, invisibile all'utente
    const fbEmail = 'pin' + pin + '@instantown.internal';
    const fbPassword = 'IT_ESE_' + pin + '_2025';
    try {
      await signInWithEmailAndPassword(auth, fbEmail, fbPassword);
    } catch(authErr) {
      console.error('DEBUG-AUTH: signIn fallito, code=' + authErr.code + ' message=' + authErr.message);
      if (authErr.code === 'auth/user-not-found' || authErr.code === 'auth/invalid-credential') {
        try { await createUserWithEmailAndPassword(auth, fbEmail, fbPassword); } catch(e) {}
      }
    }

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';

    caricaChats(trovato.nome);
    if (negozioLat && negozioLon) caricaRichiesteReverseCompatibili();
    caricaPrenotazioniAccettate(trovato.nome);

  } catch(e) {
    console.error(e);
    retryNote.style.display = 'none';
    document.getElementById('login-error').textContent = 'Errore di connessione.';
    document.getElementById('login-error').style.display = 'block';
    btn.innerHTML = 'Accedi →';
    btn.disabled = false;
  }
};

function caricaChats(negozio) {
  // Ascolta tutte le chat in realtime
  unsubChats = onSnapshot(collection(db, 'chats'), (snap) => {
    const list = document.getElementById('chat-list');
    const noChats = document.getElementById('no-chats');
    const items = list.querySelectorAll('.chat-item');
    items.forEach(i => i.remove());

    let count = 0;
    snap.forEach(doc => {
      const d = doc.data();
      // Mostra solo le chat di questo negozio
      if (d.negozio !== negozio) return;
      count++;
      noChats.style.display = 'none';
      const item = document.createElement('div');
      item.className = 'chat-item' + (doc.id === currentTX ? ' active' : '');
      item.onclick = () => apriChat(doc.id);
      const ora = d.ultimoTs ? new Date(d.ultimoTs.seconds * 1000).toLocaleString('it-IT', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      item.innerHTML = `
        <div class="chat-item-tx">${doc.id}${d.daLeggere ? '<span class="badge-new">NEW</span>' : ''}</div>
        <div class="chat-item-msg">${d.ultimoMsg || 'Nessun messaggio'}</div>
        <div class="chat-item-time">${ora}</div>
      `;
      list.appendChild(item);
    });
    if (count === 0) noChats.style.display = 'block';
  });
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function caricaRichiesteReverseCompatibili() {
  if (unsubRichiesteReverse) unsubRichiesteReverse();
  unsubRichiesteReverse = onSnapshot(collection(db, 'richieste-reverse'), (snap) => {
    const list = document.getElementById('richieste-reverse-list');
    const header = document.getElementById('richieste-reverse-header');
    list.innerHTML = '';
    let count = 0;
    snap.forEach(richDoc => {
      const r = richDoc.data();
      if (r.stato !== 'aperta') return;

      // Richiesta mirata specificamente a questo hotel per nome: la mostriamo
      // sempre, indipendentemente dalla distanza GPS (il turista l'ha scelta
      // di proposito, non conta la vicinanza).
      const isMirataAMe = r.modalita === 'mirata_registrato' &&
        String(r.hotelTarget || '').trim().toLowerCase() === String(negozioCorrente || '').trim().toLowerCase();

      let dist = null;
      if (!isMirataAMe) {
        // Comportamento originale: richiesta broadcast, filtrata per distanza
        if (typeof r.lat !== 'number' || typeof r.lon !== 'number') return;
        dist = haversine(negozioLat, negozioLon, r.lat, r.lon);
        if (dist > r.raggio) return;
      }

      count++;
      const notti = r.notti || 1;
      const card = document.createElement('div');
      card.className = 'richiesta-card';
      card.innerHTML = `
        ${isMirataAMe ? `<div style="font-size:11px;font-weight:600;color:var(--ocra-d);margin-bottom:4px;">🎯 Richiesta diretta a te</div>` : ''}
        <div class="richiesta-card-budget">💰 Budget max € ${r.budgetMax.toFixed(2)}/notte · ${notti} nott${notti===1?'e':'i'}</div>
        ${dist !== null ? `<div class="richiesta-card-dist">📍 ~${Math.round(dist)}m di distanza</div>` : ''}
        ${r.note ? `<div class="richiesta-card-note">📝 ${r.note}</div>` : ''}
        <div class="richiesta-card-totale" id="rev-totale-${richDoc.id}" style="font-size:11px;color:rgba(28,20,16,.5);margin-bottom:6px;display:none;">Totale: € <span id="rev-tot-val-${richDoc.id}">0.00</span></div>
        <div class="richiesta-propose-row" id="rev-form-${richDoc.id}">
          <input type="number" class="richiesta-input" id="rev-prezzo-${richDoc.id}" placeholder="€/notte" step="1"
            oninput="aggiornaTotale('${richDoc.id}', ${notti})">
          <button class="richiesta-propose-btn" onclick="inviaPropostaHotel('${richDoc.id}', ${notti})">Proponi →</button>
        </div>
      `;
      list.appendChild(card);
    });
    header.style.display = count > 0 ? 'block' : 'none';
  });
}

function aggiornaTotale(richiestaId, notti) {
  const input = document.getElementById('rev-prezzo-' + richiestaId);
  const totaleDiv = document.getElementById('rev-totale-' + richiestaId);
  const totaleVal = document.getElementById('rev-tot-val-' + richiestaId);
  const prezzo = parseFloat(input.value) || 0;
  if (prezzo > 0 && notti > 1) {
    totaleDiv.style.display = 'block';
    totaleVal.textContent = (prezzo * notti).toFixed(2);
  } else {
    totaleDiv.style.display = 'none';
  }
}

window.inviaPropostaHotel = async function(richiestaId, notti) {
  const input = document.getElementById('rev-prezzo-' + richiestaId);
  const prezzoNotte = parseFloat(input.value);
  if (!prezzoNotte || prezzoNotte <= 0 || !negozioCorrente) return;
  const totale = prezzoNotte * (notti || 1);
  try {
    await addDoc(collection(db, 'richieste-reverse', richiestaId, 'proposte'), {
      hotelNome: negozioCorrente,
      prezzoNotte,
      notti: notti || 1,
      totale,
      stato: 'in_attesa',
      ts: serverTimestamp()
    });
    const formRow = document.getElementById('rev-form-' + richiestaId);
    const totaleDiv = document.getElementById('rev-totale-' + richiestaId);
    if (totaleDiv) totaleDiv.style.display = 'none';
    if (formRow) formRow.innerHTML = `<span class="richiesta-inviata">✓ Proposta inviata: € ${prezzoNotte.toFixed(2)}/notte${notti > 1 ? ' · Totale € ' + totale.toFixed(2) : ''}</span>`;
  } catch(e) { console.error(e); }
};

// ── PRENOTAZIONI HOTEL ACCETTATE DAL CLIENTE ──
// Ascolta in tempo reale (via collectionGroup) tutte le proposte fatte da
// questo hotel su qualsiasi richiesta-reverse. Quando il cliente ne accetta
// una, mostriamo qui un bottone per generare il QR e inviare la conferma
// via email — lo stesso meccanismo già usato per il sistema di trading.
let unsubPrenotazioniAccettate = null;

function caricaPrenotazioniAccettate(negozio) {
  if (unsubPrenotazioniAccettate) unsubPrenotazioniAccettate();
  const q = query(collectionGroup(db, 'proposte'), where('hotelNome', '==', negozio), where('stato', '==', 'accettata'));
  unsubPrenotazioniAccettate = onSnapshot(q, (snap) => {
    const list = document.getElementById('prenotazioni-accettate-list');
    const header = document.getElementById('prenotazioni-accettate-header');
    list.innerHTML = '';
    let count = 0;
    snap.forEach(propDoc => {
      const p = propDoc.data();
      // L'id della richiesta-reverse è il genitore del genitore del doc proposta
      const richiestaId = propDoc.ref.parent.parent.id;
      count++;
      const notti = p.notti || 1;
      const totale = p.totale || (p.prezzoNotte * notti);
      const card = document.createElement('div');
      card.className = 'prenotazione-accettata-card';
      card.innerHTML = `
        <div class="prenotazione-accettata-prezzo">€ ${p.prezzoNotte.toFixed(2)}/notte · ${notti} nott${notti===1?'e':'i'} · Totale € ${totale.toFixed(2)}</div>
        <div class="prenotazione-accettata-nota">Cliente: ${p.emailCliente || 'email non disponibile'}</div>
        ${p.qrGenerato
          ? `<div class="prenotazione-qr-ok">✓ Conferma inviata al cliente</div>`
          : `<button class="btn-genera-qr-hotel" onclick="generaQRHotelEInvia(this, '${richiestaId}', '${propDoc.id}', ${totale}, '${escapeHtml(p.emailCliente || '')}')">📤 Genera QR e invia conferma</button>`}
      `;
      list.appendChild(card);
    });
    header.style.display = count > 0 ? 'block' : 'none';
  });
}

// Genera il QR per una prenotazione hotel accettata e invia l'email di
// conferma al cliente, riusando lo stesso schema 'qr_b_emessi' già usato
// dal sistema di trading, così mio-account.html mostra il QR ovunque il
// cliente acceda, indipendentemente dal dispositivo.
window.generaQRHotelEInvia = async function(btn, richiestaId, propostaId, prezzoTotale, emailCliente) {
  if (!emailCliente) {
    alert('Email del cliente non disponibile per questa prenotazione.');
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  try {
    const idQr = 'QR-HOTEL-' + Date.now();
    await setDoc(doc(db, 'qr_b_emessi', idQr), {
      email: emailCliente,
      negozio: negozioCorrente || '',
      prezzo: prezzoTotale,
      tx: 'HOTEL-' + richiestaId,
      stato: 'attivo',
      ts: serverTimestamp()
    });

    await updateDoc(doc(db, 'richieste-reverse', richiestaId, 'proposte', propostaId), { qrGenerato: true });

    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({
        tipo: 'notifica_qr_pronto',
        email: emailCliente,
        negozio: negozioCorrente || '',
        prezzo: prezzoTotale
      })
    });
  } catch(e) {
    console.error('Errore generazione QR hotel:', e);
    if (btn) { btn.disabled = false; btn.textContent = '📤 Genera QR e invia conferma'; }
  }
};

  accetta:         { it:'Accetta', en:'Accept', zh:'接受', es:'Aceptar', fr:'Accepter', de:'Annehmen' },
  rifiuta:         { it:'Rifiuta', en:'Decline', zh:'拒绝', es:'Rechazar', fr:'Refuser', de:'Ablehnen' },

function tt(key) {
  const lang = getCurrentLang();
  return (TRADING_LABELS[key] && (TRADING_LABELS[key][lang] || TRADING_LABELS[key].it)) || key;
}

window.rispondiProposta = async function(msgId, azione) {
  if (!currentTX) return;
  try {
    await updateDoc(doc(db, 'chats', currentTX, 'messages', msgId), {
      stato: azione === 'accetta' ? 'accettata' : 'rifiutata'
    });
  } catch(e) { console.error(e); }
};

window.toggleRilanciaPanel = function(msgId) {
  const panel = document.getElementById('rilancia-' + msgId);
  if (panel) panel.classList.toggle('open');
};

window.inviaRilancio = async function(msgId, offertaOriginale) {
  if (!currentTX) return;
  const input = document.getElementById('rilancia-input-' + msgId);
  const notaInput = document.getElementById('rilancia-nota-' + msgId);
  const valore = parseFloat(input.value);
  const nota = notaInput ? notaInput.value.trim() : '';
  if (!valore || valore <= 0) return;
  try {
    await updateDoc(doc(db, 'chats', currentTX, 'messages', msgId), { stato: 'rifiutata' });
    const scadenza = new Date(Date.now() + 12 * 60 * 1000);
    await addDoc(collection(db, 'chats', currentTX, 'messages'), {
      tipo: 'proposta', prezzoProposto: valore, daChi: 'esercente',
      stato: 'in_attesa', scadenza: scadenza.toISOString(),
      offertaOriginale: offertaOriginale, nota: nota || null, ts: serverTimestamp()
    });
    await updateDoc(doc(db, 'chats', currentTX), {
      ultimoMsg: '🔄 Controproposta: € ' + valore.toFixed(2), ultimoTs: serverTimestamp(), daLeggere: false
    });
  } catch(e) { console.error(e); }
};

// Genera il QR-A (lato esercente) e, in un unico passo:
// 1. salva un documento in 'qr_b_emessi' — questo è il dato centrale che
//    mio-account.html leggerà per mostrare il QR-B al cliente, da
//    qualsiasi dispositivo usi (non dipende dal localStorage di un
//    singolo browser);
// 2. marca la proposta come 'qrGenerato' per non permettere doppi invii;
// 3. chiama l'Apps Script per mandare l'email di notifica al cliente,
//    con un link a mio-account.html dove troverà il QR pronto.
window.generaQRAEInvia = async function(btn, msgId, prezzo, emailCliente) {
  if (!currentTX || !emailCliente) {
    alert('Email del cliente non disponibile per questa proposta.');
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  try {
    const idQr = 'QR-' + Date.now();
    await setDoc(doc(db, 'qr_b_emessi', idQr), {
      email: emailCliente,
      negozio: negozioCorrente || '',
      prezzo: prezzo,
      tx: currentTX,
      stato: 'attivo',
      ts: serverTimestamp()
    });

    await updateDoc(doc(db, 'chats', currentTX, 'messages', msgId), { qrGenerato: true });

    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        tipo: 'notifica_qr_pronto',
        email: emailCliente,
        negozio: negozioCorrente || '',
        prezzo: prezzo
      })
    });
  } catch(e) {
    console.error('Errore generazione QR:', e);
    if (btn) { btn.disabled = false; btn.textContent = tt('generaQRInvia'); }
  }
};

function renderProposta(d, docId, isUltima) {
  const scaduta = d.stato === 'in_attesa' && d.scadenza && new Date(d.scadenza) < new Date();
  const statoEffettivo = scaduta ? 'scaduta' : d.stato;
  const daEsercente = d.daChi === 'esercente';
  const div = document.createElement('div');
  div.className = 'msg-proposta ' + (daEsercente ? 'da-esercente' : 'da-cliente') + (statoEffettivo !== 'in_attesa' ? ' msg-proposta-scaduta' : '');

  let azioniHtml = '';
  if (statoEffettivo === 'in_attesa' && isUltima && !daEsercente) {
    azioniHtml = `<div class="msg-proposta-actions">
      <button class="btn-pr-rifiuta" onclick="rispondiProposta('${docId}','rifiuta')">${tt('rifiuta')}</button>
      <button class="btn-pr-rilancia" onclick="toggleRilanciaPanel('${docId}')">${tt('rilancia')}</button>
      <button class="btn-pr-accetta" onclick="rispondiProposta('${docId}','accetta')">${tt('accetta')}</button>
    </div>
    <div class="rilancia-panel" id="rilancia-${docId}">
      <div class="rilancia-input-row">
        <input type="number" class="rilancia-input" id="rilancia-input-${docId}" placeholder="0.00" step="0.50">
        <button class="rilancia-send" onclick="inviaRilancio('${docId}', ${d.offertaOriginale || d.prezzoProposto})">${tt('invia')}</button>
      </div>
      <input type="text" class="rilancia-nota-input" id="rilancia-nota-${docId}" placeholder="Nota (opzionale)" maxlength="140">
    </div>`;
  }

  let statoHtml = '';
  if (statoEffettivo === 'accettata') {
    statoHtml = `<div class="msg-proposta-stato accettata">✅ ${tt('accordoRaggiunto')} € ${d.prezzoProposto.toFixed(2)}</div>`;
    if (!d.qrGenerato) {
      statoHtml += `<button class="btn-genera-qr" onclick="generaQRAEInvia(this, '${docId}', ${d.prezzoProposto}, '${escapeHtml(d.emailCliente || '')}')">📤 ${tt('generaQRInvia')}</button>`;
    } else {
      statoHtml += `<div class="msg-proposta-qr-ok">✓ ${tt('qrInviato')}</div>`;
    }
  } else if (statoEffettivo === 'rifiutata') {
    statoHtml = `<div class="msg-proposta-stato rifiutata">✕ ${tt('propostaRifiutata')}</div>`;
  } else if (statoEffettivo === 'scaduta') {
    statoHtml = `<div class="msg-proposta-stato scaduta">⏱ ${tt('propostaScaduta')}</div>`;
  } else if (d.scadenza) {
    const msRimanenti = new Date(d.scadenza) - new Date();
    const minRimanenti = Math.max(0, Math.ceil(msRimanenti / 60000));
    statoHtml = `<div class="msg-proposta-countdown">${tt('scadeIn')} ${minRimanenti} min</div>`;
  }

  const notaHtml = d.nota ? `<div class="msg-proposta-nota">"${escapeHtml(d.nota)}"</div>` : '';
  const label = daEsercente ? tt('laTuaProposta') : tt('controproposta');
  div.innerHTML = `<div class="msg-proposta-label">${label}</div><div class="msg-proposta-amount">€ ${d.prezzoProposto.toFixed(2)}</div>${notaHtml}${azioniHtml}${statoHtml}`;
  return div;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getCurrentLang() {
  return localStorage.getItem('it_lang') || 'it';
}

function testoVisualizzato(d) {
  if (d.quickPhrase && QUICK_PHRASES[d.quickPhrase]) {
    const lang = getCurrentLang();
    return QUICK_PHRASES[d.quickPhrase][lang] || QUICK_PHRASES[d.quickPhrase].it;
  }
  if (d.da === 'cliente' && d.testoIt) return d.testoIt;
  return d.testo;
}

window.apriChat = function(tx) {
  currentTX = tx;
  document.getElementById('chat-area-empty').style.display = 'none';
  const active = document.getElementById('chat-active');
  active.style.display = 'flex';
  document.getElementById('active-tx').textContent = tx;

  // Segna come letto
  updateDoc(doc(db, 'chats', tx), { daLeggere: false }).catch(() => {});

  if (unsubMessages) unsubMessages();
  const q = query(collection(db, 'chats', tx, 'messages'), orderBy('ts'));
  unsubMessages = onSnapshot(q, (snap) => {
    const container = document.getElementById('messages');
    container.innerHTML = '';
    const docs = [];
    snap.forEach(d => docs.push({ id: d.id, data: d.data() }));
    const ultimaPropostaIdx = docs.map(x => x.data.tipo === 'proposta').lastIndexOf(true);
    docs.forEach((item, idx) => {
      const msg = item.data;
      if (msg.tipo === 'proposta') {
        const div = renderProposta(msg, item.id, idx === ultimaPropostaIdx);
        container.appendChild(div);
      } else {
        const div = document.createElement('div');
        div.className = 'msg msg-' + (msg.da === 'esercente' ? 'esercente' : msg.da === 'sistema' ? 'sistema' : 'cliente');
        const ora = msg.ts ? new Date(msg.ts.seconds * 1000).toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'}) : '';
        const notaColor = 'rgba(28,20,16,.65)';
        div.innerHTML = `<div>${testoVisualizzato(msg)}</div>${msg.quickPhrase ? `<div style="font-size:9px;opacity:1;color:${notaColor};margin-top:2px;font-style:italic;">âš¡ frase rapida</div>` : ''}${ora ? `<div class="msg-time">${ora}</div>` : ''}`;
        container.appendChild(div);
      }
    });
    requestAnimationFrame(() => {
      container.scrollTop = container.scrollHeight;
    });
  });

  // Aggiorna active in lista
  document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.chat-item').forEach(i => {
    if (i.querySelector('.chat-item-tx').textContent.includes(tx)) i.classList.add('active');
  });
};

window.inviaMsgEsercente = async function() {
  const input = document.getElementById('msg-input');
  const testo = input.value.trim();
  if (!testo || !currentTX) return;
  input.value = '';
  try {
    // Legge la lingua del cliente (salvata quando e' entrato in chat)
    // per tradurre questa risposta prima di salvarla, cosi' lui la
    // legge sempre nella propria lingua senza fraintendimenti.
    let testoCliente = testo;
    try {
      const chatDoc = await getDoc(doc(db, 'chats', currentTX));
      const linguaCliente = chatDoc.exists() ? (chatDoc.data().linguaCliente || 'it') : 'it';
      if (linguaCliente !== 'it') {
        const tradResp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({ tipo: 'traduci_messaggio', testo, da: 'it', a: linguaCliente })
        });
        const tradJson = await tradResp.json();
        if (tradJson.stato === 'ok' && tradJson.tradotto) testoCliente = tradJson.tradotto;
      }
    } catch (tradErr) {
      console.warn('Traduzione risposta fallita, salvo originale:', tradErr);
    }
    await addDoc(collection(db, 'chats', currentTX, 'messages'), {
      testo, testoCliente, da: 'esercente', ts: serverTimestamp()
    });
    await updateDoc(doc(db, 'chats', currentTX), {
      ultimoMsg: testo, ultimoTs: serverTimestamp(), daLeggere: false
    });
  } catch(e) { console.error(e); }
};

document.getElementById('msg-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.inviaMsgEsercente(); }
});
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
