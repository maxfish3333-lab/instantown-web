<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso in corso… — INSTANTOWN</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif;
         display:flex; flex-direction:column; align-items:center;
         justify-content:center; min-height:100vh; text-align:center; padding:20px; box-sizing:border-box; }
  .spinner { width:48px; height:48px; border:4px solid #333; border-top-color:#4CAF50;
             border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:24px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h2 { font-size:1.2rem; margin:0 0 8px; }
  p  { color:#aaa; font-size:0.9rem; margin:0; }
  .errore { color:#ff6b6b; font-size:0.95rem; margin-top:16px; }
</style>
</head>
<body>
<div class="spinner" id="spinner"></div>
<h2 id="titolo">Completamento accesso…</h2>
<p id="sottotitolo">Un momento, stiamo verificando la tua identità.</p>
<p class="errore" id="errore" style="display:none;"></p>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, isSignInWithEmailLink, signInWithEmailLink }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// ── Config Firebase (stessa usata in offerte.html / map.html) ──
const firebaseConfig = {
  apiKey:            "AIzaSyBez4L85HA1__NPKOzagfmKeoGLniIQeAc",
  authDomain:        "instantown-app.firebaseapp.com",
  projectId:         "instantown-app",
  storageBucket:     "instantown-app.firebasestorage.app",
  messagingSenderId: "469598782572",
  appId:             "1:469598782572:web:e4a53e7ad2be25e9ce9dfd"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

const params     = new URLSearchParams(window.location.search);
const email      = params.get('email') || '';
const crEncoded  = params.get('cr')    || '';

function mostraErrore(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('titolo').textContent = 'Accesso non riuscito';
  document.getElementById('sottotitolo').textContent = 'Puoi riprovare dalla pagina delle offerte.';
  const el = document.getElementById('errore');
  el.style.display = 'block';
  el.textContent = msg;
}

if (!isSignInWithEmailLink(auth, window.location.href)) {
  mostraErrore('Link non valido o già utilizzato.');
} else if (!email) {
  mostraErrore('Email mancante nel link. Riprova la prenotazione.');
} else {
  signInWithEmailLink(auth, email, window.location.href)
    .then(() => {
      // Rimuovi it_modalita in tutti i contesti accessibili
      try { localStorage.removeItem('it_modalita'); } catch(e) {}
      // Redirect al checkout (o a offerte.html se non c'è cr)
      const dest = crEncoded || 'offerte.html';
      window.location.replace(dest);
    })
    .catch(err => {
      console.error('auth-complete signIn error:', err);
      const msg = err.code === 'auth/invalid-action-code'
        ? 'Questo link è già stato usato o è scaduto. Richiedi un nuovo link dalla pagina delle offerte.'
        : 'Errore: ' + (err.message || 'riprova.');
      mostraErrore(msg);
    });
}
</script>
</body>
</html>
