<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTANTOWN — Attiva i pagamenti</title>
<style>
  body{font-family:'DM Sans',Arial,sans-serif;background:#FDFAF4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;}
  .box{background:#fff;max-width:420px;width:100%;padding:36px 28px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center;}
  h1{font-family:Georgia,'Cormorant Garamond',serif;font-size:22px;color:#1C1410;margin:0 0 12px;}
  p{font-size:14px;color:#3D2E24;line-height:1.6;margin:0;}
  .spinner{width:34px;height:34px;border:3px solid #eee;border-top-color:#635BFF;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .errore{color:#8E1F2F;font-weight:600;margin-top:8px;}
  .btn-retry{display:inline-block;margin-top:18px;background:#1C1410;color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;}
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="titolo">ATTIVA INCASSI IN CORSO</h1>
    <p id="messaggio">Ti stiamo reindirizzando su Stripe per completare la configurazione.</p>
  </div>

<script>
  // Stesso deployment Apps Script usato dal resto del sito
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkkLUMGYiPXLMAozZgbWaMZoG-oKfj5chDCXus2bsrienwjPD9YcTRH3o8FVksX24L/exec';

  const params = new URLSearchParams(window.location.search);
  const email = params.get('email');
  const pin = params.get('pin');

  const spinnerEl = document.getElementById('spinner');
  const titoloEl = document.getElementById('titolo');
  const messaggioEl = document.getElementById('messaggio');

  function mostraErrore(testo) {
    spinnerEl.style.display = 'none';
    titoloEl.textContent = '⚠️ Non siamo riusciti ad avviare l\'attivazione';
    messaggioEl.textContent = testo;
    messaggioEl.classList.add('errore');
    messaggioEl.insertAdjacentHTML('afterend',
      '<a href="mailto:info@instantown.it" class="btn-retry">Contattaci per assistenza</a>');
  }

  async function avvia() {
    if (!email || !pin) {
      mostraErrore('Link non valido: mancano i dati necessari. Riapri il link ricevuto via email.');
      return;
    }
    try {
      const url = APPS_SCRIPT_URL + '?azione=avviaStripeOnboarding&email=' +
        encodeURIComponent(email) + '&pin=' + encodeURIComponent(pin);
      const res = await fetch(url);
      const dati = await res.json();
      if (dati.stato === 'ok' && dati.url) {
        window.location.href = dati.url;
      } else {
        mostraErrore(dati.messaggio || 'Impossibile avviare l\'attivazione. Riprova più tardi.');
      }
    } catch (err) {
      mostraErrore('Errore di rete. Riprova tra qualche minuto.');
    }
  }

  avvia();
</script>
</body>
</html>
