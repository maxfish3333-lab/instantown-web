<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <circle cx="64" cy="64" r="62" fill="#F2A900"/>

  <!-- AUTO (sinistra, più piccola per fare spazio) -->
  <g transform="translate(4,58)">
    <rect x="0" y="8" width="24" height="10" rx="3" fill="#1c1410"/>
    <path d="M4 8 L7 -1 L18 -1 L21 8 Z" fill="#1c1410"/>
    <rect x="6" y="0" width="11" height="7" rx="1.2" fill="#F2A900"/>
    <circle cx="6" cy="20" r="4" fill="#1c1410"/>
    <circle cx="6" cy="20" r="1.6" fill="#F2A900"/>
    <circle cx="18" cy="20" r="4" fill="#1c1410"/>
    <circle cx="18" cy="20" r="1.6" fill="#F2A900"/>
  </g>

  <!-- FRECCIA centrale -->
  <line x1="32" y1="63" x2="52" y2="63" stroke="#1c1410" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 56 L55 63 L46 70" fill="none" stroke="#1c1410" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- BADGE METRO: rettangolo rosso con M sopra e scritta METRO sotto, centrato sull'auto -->
