  <text x="88" y="77" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">M</text>
  <text x="88" y="91" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#ffffff" text-anchor="middle">METRO</text>

  <circle cx="64" cy="64" r="62" fill="none" stroke="#1c1410" stroke-width="2" opacity="0.15"/>
