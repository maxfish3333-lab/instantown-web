<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --rosso:#8B1A1A;--rosso-l:#C0392B;--rosso-p:#FDF0EF;
  --ocra:#C8860A;--ocra-l:#E8A020;--ocra-p:#FDF3DC;
  --cielo:#4A90C4;--cielo-l:#6AAFD8;
  --verde:#1A7A3A;--verde-l:#22A050;--verde-p:#EAF5EE;
  --ink:#1C1410;--ink-m:#3D2E24;--ink-mu:#6B5A4E;
  --bianco:#FDFAF4;--rule:rgba(139,26,26,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;}

/* ── STRIPE ── */
.stripe{height:4px;background:linear-gradient(90deg,var(--rosso-l) 33.3%,#fff 33.3%,#fff 66.6%,var(--cielo) 66.6%);position:relative;z-index:1000;}

/* ── TOP BAR ── */
.topbar{
  position:absolute;top:4px;left:0;right:0;z-index:900;
  background:rgba(28,20,16,.88);backdrop-filter:blur(8px);
  padding:10px 16px;display:flex;align-items:center;gap:12px;
}
.topbar-back{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:50%;color:#fff;font-size:20px;text-decoration:none;flex-shrink:0;transition:background .2s;}.topbar-back:hover{background:rgba(255,255,255,.3);}
.topbar-back:hover{color:var(--ocra-l);}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#fff;flex:1;}
.topbar-title span{color:var(--verde-l);}
.gps-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:5px 12px;font-size:11px;color:rgba(255,255,255,.6);
  flex-shrink:0;
}
.gps-dot{width:7px;height:7px;border-radius:50%;background:#666;flex-shrink:0;}
.gps-dot.active{background:var(--verde-l);animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── LANG SWITCHER (custom, no native <select> per fix bandiere emoji su WebKit) ── */
.lang-switch{position:relative;flex-shrink:0;}
.lang-switch-btn{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  color:#fff;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;
  padding:4px 8px;border-radius:4px;cursor:pointer;user-select:none;
}
.lang-switch-btn:hover{background:rgba(255,255,255,.18);}
.lang-switch-flag{font-size:13px;line-height:1;}
.lang-switch-caret{font-size:9px;opacity:.7;margin-left:1px;}
.lang-switch-list{
  position:absolute;top:calc(100% + 4px);left:0;z-index:1000;
  background:#2A1F18;border:1px solid rgba(255,255,255,.18);border-radius:6px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  min-width:96px;padding:4px;display:none;
}
.lang-switch-list.open{display:block;}
.lang-switch-opt{
  display:flex;align-items:center;gap:7px;
  padding:7px 9px;border-radius:4px;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:12px;color:#fff;
  white-space:nowrap;
}
.lang-switch-opt:hover{background:rgba(255,255,255,.12);}
.lang-switch-opt.active{background:rgba(34,160,80,.25);}
.lang-switch-opt .lang-switch-flag{font-size:14px;}

/* ── MAPPA ── */
#map{
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;
}

/* ── RADAR OVERLAY ── */
.radar-ring{
  position:absolute;z-index:50;pointer-events:none;
  border-radius:50%;border:1.5px solid rgba(34,160,80,.35);
  transform:translate(-50%,-50%);
  animation:radarPulse 3s ease-out infinite;
}
@keyframes radarPulse{
  0%{opacity:.8;transform:translate(-50%,-50%) scale(.6);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.4);}
}

/* ── FILTRI CATEGORIA ── */
.filtri-wrap{
  position:absolute;bottom:0;left:0;right:0;z-index:800;
}
.filtri{
  padding:10px 12px 14px;
  display:grid;grid-template-columns:repeat(3, 1fr);gap:7px;
  background:linear-gradient(to top,rgba(28,20,16,.75) 0%,rgba(28,20,16,.4) 70%,transparent 100%);
}
.filtro{
  padding:7px 8px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);
  background:rgba(28,20,16,.6);backdrop-filter:blur(6px);
  font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:500;
  color:rgba(255,255,255,.75);cursor:pointer;transition:all .2s;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.filtro:hover{border-color:rgba(255,255,255,.5);}
.filtro.active{background:var(--verde);border-color:var(--verde-l);color:#fff;}
.filtro.active-ocra{background:var(--ocra);border-color:var(--ocra-l);color:var(--ink);}

/* Colori distintivi per le 5 categorie principali, sempre visibili */
.filtro-pubblico{background:#1A7A3A;border-color:#4AB890;}
.filtro-iconico{background:#9C3E5E;border-color:#C25A7E;}
.filtro-bus{background:#1F7A5C;border-color:#4AB890;}
.filtro-bancomat{background:#B8730A;border-color:#E8A020;}
.filtro-poste{background:#D4AF00;border-color:#9A7D00;color:#1C1410;}
.filtro-pubblico.active,.filtro-iconico.active,.filtro-bus.active,.filtro-bancomat.active,.filtro-poste.active{
  color:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3);
}

/* ── SCHEDA POI (bottom sheet) ── */
.poi-sheet{
  position:absolute;bottom:-300px;left:0;right:0;z-index:900;
  background:var(--bianco);border-radius:20px 20px 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,.25);
  transition:bottom .35s cubic-bezier(.32,1,.52,.98);
  padding:0 0 32px;
}
.poi-sheet.open{bottom:0;}
.sheet-handle{width:36px;height:4px;background:var(--rule);border-radius:2px;margin:12px auto 0;}
.sheet-body{padding:18px 20px 0;}
.sheet-row1{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
.sheet-emoji{font-size:36px;flex-shrink:0;}
.sheet-info{flex:1;}
.sheet-cat{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--verde);margin-bottom:4px;}
.sheet-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--ink);line-height:1.2;margin-bottom:4px;}
.sheet-desc{font-size:13px;color:var(--ink-mu);line-height:1.6;}
.sheet-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.sheet-badge{font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid;}
.badge-verde{background:var(--verde-p);color:var(--verde);border-color:rgba(26,122,58,.2);}
.badge-ocra{background:var(--ocra-p);color:var(--ocra);border-color:rgba(200,134,10,.2);}
.badge-cielo{background:#E8F4FB;color:var(--cielo);border-color:rgba(74,144,196,.2);}
.badge-rosso{background:var(--rosso-p);color:var(--rosso);border-color:rgba(139,26,26,.2);}
.btn-portami{
  width:100%;padding:15px;border:none;border-radius:8px;
  background:var(--verde);color:#fff;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:10px;transition:background .2s;letter-spacing:.02em;
}
.btn-portami:hover{background:var(--verde-l);}
.btn-portami-icon{font-size:20px;}
.sheet-close{
  position:absolute;top:14px;right:16px;
  background:none;border:none;font-size:20px;color:var(--ink-mu);
  cursor:pointer;padding:4px 8px;border-radius:4px;
}
.sheet-close:hover{background:var(--rule);}

/* ── PANNELLO LISTA CATEGORIA ── */
.cat-list-panel{
  position:absolute;bottom:-70%;left:0;right:0;z-index:850;
  height:70%;background:var(--bianco);border-radius:20px 20px 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,.25);
  transition:bottom .35s cubic-bezier(.32,1,.52,.98);
  display:flex;flex-direction:column;
}
.cat-list-panel.open{bottom:0;}
.cat-list-header{
  padding:12px 20px 14px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.cat-list-title{
  font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;
  color:var(--ink);display:flex;align-items:center;gap:8px;
}
.cat-list-count{
  font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink-mu);
  background:var(--rule);padding:2px 10px;border-radius:20px;margin-left:6px;
}
.cat-list-close{
  background:none;border:none;font-size:20px;color:var(--ink-mu);
  cursor:pointer;padding:4px 8px;border-radius:4px;
}
.cat-list-close:hover{background:var(--rule);}
.cat-list-body{flex:1;overflow-y:auto;padding:8px 12px 24px;-webkit-overflow-scrolling:touch;}
.cat-list-row{
  display:flex;align-items:center;gap:12px;padding:13px 12px;
  border-radius:12px;cursor:pointer;transition:background .15s;
  border-bottom:1px solid var(--rule);
}
.cat-list-row:last-child{border-bottom:none;}
.cat-list-row:hover{background:var(--ocra-p);}
.cat-list-emoji{font-size:26px;flex-shrink:0;width:36px;text-align:center;}
.cat-list-info{flex:1;min-width:0;}
.cat-list-nome{
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cat-list-sub{font-size:11px;color:var(--ink-mu);margin-top:1px;}
.cat-list-dist{
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  color:var(--ocra);flex-shrink:0;white-space:nowrap;
}

/* ── MARKER PERSONALIZZATI ── */
.marker-wrap{
  min-width:52px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 3px 14px rgba(0,0,0,.45);
  border:2px solid rgba(255,255,255,.9);
  transition:transform .18s;padding:0 10px;
  font-family:'DM Sans',sans-serif;letter-spacing:.01em;
  white-space:nowrap;
}
.marker-wrap:hover{transform:scale(1.08);}
.marker-pubblico{background:#1A7A3A;color:#fff;}
.marker-acqua{background:#1A6FA8;color:#fff;border:2px solid #4A9FD8;}
.marker-presa{background:#F06595;color:#fff;border:2px solid #FFA8C5;}
.marker-taxi{background:#C8860A;color:#fff;border:2px solid #E8A020;}
.marker-metro{background:#5B4B9E;color:#fff;border:2px solid #8273C4;}
.marker-agenzia{background:#4A90C4;color:#fff;border:2px solid #6AAFD8;}
.marker-iconico{background:#9C3E5E;color:#fff;border:2px solid #C25A7E;}
.marker-papa{background:#FEE100;color:#3D2E0A;border:2px solid #FFF066;}
.marker-bagni{background:#E03050;color:#fff;border:2px solid #FF6080;}
.marker-bus{background:#2A8A6A;color:#fff;border:2px solid #4AB890;}
.marker-bancomat{background:#1C1410;color:#fff;border:2px solid #C8860A;}
.marker-poste{background:#FFD200;color:#1C1410;border:2px solid #B8860B;}
.marker-wrap .m-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.8);flex-shrink:0;}
.marker-papa .m-dot{background:rgba(61,46,10,.6);}

/* ── LOADING ── */
.gps-loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:800;background:rgba(28,20,16,.82);backdrop-filter:blur(8px);
  border-radius:12px;padding:24px 28px;text-align:center;color:#fff;
}
.gps-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--verde-l);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.gps-loading p{font-size:13px;color:rgba(255,255,255,.6);}
.dist-badge-icon{background:transparent!important;border:none!important;box-shadow:none!important;overflow:visible!important;}

</style>
</head>

<script>
// Helper i18n locale per servizi.html
function i18nGetSv(key, fallback) {
  try {
    var lang = localStorage.getItem('it_lang') || 'it';
    if (typeof IT18N !== 'undefined' && IT18N[lang] && IT18N[lang][key]) {
      return IT18N[lang][key];
    }
  } catch(e) {}
  return fallback;
}

function applyI18nDOMServizi() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    var val = i18nGetSv(key, el.textContent);
    el.textContent = val;
  });
}

// ═══════════════════════════════════════════════
// LANG SWITCHER CUSTOM (dropdown non nativo)
// Sostituisce il <select> nativo per evitare il bug
// delle bandiere emoji renderizzate in bianco/outline
// dentro <option> su WebKit/Safari finché non in hover.
// ═══════════════════════════════════════════════
const LANG_SWITCH_DATA = {
  it: { flag: '🇮🇹', label: 'IT' },
  en: { flag: '🇬🇧', label: 'EN' },
  zh: { flag: '🇨🇳', label: '中文' },
  es: { flag: '🇪🇸', label: 'ES' },
  fr: { flag: '🇫🇷', label: 'FR' },
  de: { flag: '🇩🇪', label: 'DE' }
};

function toggleLangSwitch(e) {
  if (e) e.stopPropagation();
  document.getElementById('lang-switch-list').classList.toggle('open');
}

function selectLang(lang) {
  document.getElementById('lang-switch-list').classList.remove('open');
  var hiddenSel = document.getElementById('lang-sel');
  if (hiddenSel) hiddenSel.value = lang;
  applyLang(lang);
  syncLangSwitchDisplay(lang);
}

function syncLangSwitchDisplay(lang) {
  var data = LANG_SWITCH_DATA[lang] || LANG_SWITCH_DATA.it;
  var flagEl = document.getElementById('lang-switch-flag');
  var labelEl = document.getElementById('lang-switch-label');
  if (flagEl) flagEl.textContent = data.flag;
  if (labelEl) labelEl.textContent = data.label;
  document.querySelectorAll('.lang-switch-opt').forEach(function(opt) {
    opt.classList.toggle('active', opt.getAttribute('data-lang') === lang);
  });
}

// Chiudi il dropdown cliccando altrove
document.addEventListener('click', function(e) {
  var sw = document.getElementById('lang-switch');
  if (sw && !sw.contains(e.target)) {
    document.getElementById('lang-switch-list').classList.remove('open');
  }
});

// Sincronizza il display al caricamento con la lingua salvata
(function initLangSwitch() {
  var savedLang = localStorage.getItem('it_lang') || 'it';
  syncLangSwitchDisplay(savedLang);
})();

function getPoiTradotto(poi) {
  var lang = localStorage.getItem('it_lang') || 'it';
  var t = (POI_I18N[poi.id] && POI_I18N[poi.id][lang]) || (POI_I18N[poi.id] && POI_I18N[poi.id].it);
  if (!t) return poi; // fallback: POI senza traduzione (taxi/metro/agenzie - Fase 3)
  return Object.assign({}, poi, {
    nome: t.nome, cat: t.cat, desc: t.desc,
    badges: poi.badges.map(function(b, i) { return { t: t.badges[i] || b.t, c: b.c }; })
  });
}

function initMappa(lat, lon) {
  document.getElementById('gps-loading').style.display = 'none';
  document.getElementById('gps-dot').classList.add('active');
  document.getElementById('gps-label').textContent = i18nGetSv('sv_gps_attivo', 'GPS attivo');

  userLat = lat; userLon = lon;

  map = L.map('map', {
    center: [lat, lon],
    zoom: 15,
    zoomControl: false,
    attributionControl: true
  });

  // Tile OpenStreetMap standard — più contrasto, leggibile anche sotto sole forte
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
    subdomains:'abc', maxZoom:19
  }).addTo(map);

  // Marker utente
  const userIcon = L.divIcon({
    html:`<div style="
      width:18px;height:18px;border-radius:50%;
      background:var(--cielo);border:3px solid #fff;
      box-shadow:0 0 0 6px rgba(74,144,196,.25);
    "></div>`,
    iconSize:[18,18], iconAnchor:[9,9], className:''
  });
  userMarker = L.marker([lat,lon], {icon:userIcon, zIndexOffset:1000}).addTo(map);

  // Cerchio raggio 200m
  L.circle([lat,lon], {
    radius:200, color:'rgba(34,160,80,.4)',
    fillColor:'rgba(34,160,80,.05)', fillOpacity:1, weight:1.5
  }).addTo(map);

  // Salva tutti i POI per uso futuro nei filtri
  window._tuttiPOI = POIS;

  // Mappa pulita all'avvio: nessun pannello aperto, l'utente sceglie
  // quale categoria esplorare dalla griglia dei filtri in basso.

  // Ricalcola anti-collisione marker su zoom/pan, e al primo render
  map.on('zoomend moveend', risolviCollisioniMarker);
  setTimeout(risolviCollisioniMarker, 50);
}

function getMarkerLabel(poi) {
  var lang = localStorage.getItem('it_lang') || 'it';
  var entry = MARKER_LABEL_SHORT[poi.id];
  var testo = (entry && (entry[lang] || entry.it)) || poi.nome.substring(0,14);
  return poi.emoji + ' ' + testo;
}

// Stima la larghezza in px della pillola del marker dato il testo.
// I caratteri CJK (cinese/giapponese/coreano) sono visivamente larghi
// quasi il doppio di una lettera latina nello stesso font-size, quindi
// una stima uniforme "n_caratteri * px_per_carattere" sottostimava la
// larghezza reale per il cinese e il testo debordava dalla pillola.
// Qui contiamo i due gruppi di caratteri separatamente e pesiamo
// ciascuno con il proprio coefficiente medio (font 13px bold).
function calcolaLarghezzaMarker(label) {
  const cjkRegex = /[\u4E00-\u9FFF\u3400-\u4DBF\uF900-\uFAFF]/g;
  const cjkChars = (label.match(cjkRegex) || []).length;
  const altriChars = label.length - cjkChars;
  const px = cjkChars * 15 + altriChars * 7.5 + 24;
  return Math.max(60, px);
}

function addMarker(poi) {
  const colClass = poi.id === 'nasoni' ? 'marker-acqua' :
    poi.id === 'papa' ? 'marker-papa' :
    poi.id.startsWith('presa-') ? 'marker-presa' :
    poi.tipo === 'pubblico' ? 'marker-pubblico' : 
    poi.tipo === 'bagni' ? 'marker-bagni' : 
    poi.tipo === 'taxi' ? 'marker-taxi' :
    poi.tipo === 'metro' ? 'marker-metro' :
    poi.tipo === 'bus' ? 'marker-bus' :
    poi.tipo === 'bancomat' ? 'marker-bancomat' :
    poi.tipo === 'poste' ? 'marker-poste' :
    poi.tipo === 'agenzia' ? 'marker-agenzia' : 'marker-iconico';
  const label = getMarkerLabel(poi);
  // FIX overlap marker su mobile: iconSize:[null,36] lasciava a Leaflet
  // un calcolo di centratura basato su una larghezza sconosciuta a runtime
  // (comportamento documentato come inconsistente tra browser/dispositivi:
  // github.com/Leaflet/Leaflet/issues/1390). Usiamo una larghezza FISSA
  // e nota (stimata sul testo più lungo, +padding), con anchor centrato
  // matematicamente: risultato deterministico su ogni piattaforma.
  // Il CSS .marker-wrap ha comunque white-space:nowrap, quindi la pillola
  // resta della sua larghezza naturale; impostiamo solo il "punto di presa"
  // di Leaflet, non la larghezza visiva reale del div.
  const estWidth = calcolaLarghezzaMarker(label);
  const icon = L.divIcon({
    html:`<div class="marker-wrap ${colClass}"><span class="m-dot"></span>${label}</div>`,
    iconSize:[estWidth, 36], iconAnchor:[estWidth/2, 36], className:''
  });
  const m = L.marker([poi.lat, poi.lon], {icon}).addTo(map);
  m.on('click', () => { navStack = []; apriSheet(poi); });
  markers[poi.id] = {marker:m, poi};
}

// Ri-renderizza solo le ICONE dei marker già presenti sulla mappa
// (stesso oggetto marker Leaflet, stessa posizione e click-handler),
// usata quando cambia la lingua per aggiornare le etichette senza
// dover ricostruire/ri-filtrare l'intera mappa.
function refreshMarkerLabels() {
  Object.values(markers).forEach(function(entry) {
    const poi = entry.poi;
    const colClass = poi.id === 'nasoni' ? 'marker-acqua' :
      poi.id === 'papa' ? 'marker-papa' :
      poi.id.startsWith('presa-') ? 'marker-presa' :
      poi.tipo === 'pubblico' ? 'marker-pubblico' :
      poi.tipo === 'bagni' ? 'marker-bagni' :
      poi.tipo === 'taxi' ? 'marker-taxi' :
      poi.tipo === 'metro' ? 'marker-metro' :
      poi.tipo === 'bus' ? 'marker-bus' :
      poi.tipo === 'bancomat' ? 'marker-bancomat' :
      poi.tipo === 'poste' ? 'marker-poste' :
      poi.tipo === 'agenzia' ? 'marker-agenzia' : 'marker-iconico';
    const label = getMarkerLabel(poi);
    const estWidth = calcolaLarghezzaMarker(label);
    const icon = L.divIcon({
      html:`<div class="marker-wrap ${colClass}"><span class="m-dot"></span>${label}</div>`,
      iconSize:[estWidth, 36], iconAnchor:[estWidth/2, 36], className:''
    });
    entry.marker.setIcon(icon);
  });
  setTimeout(risolviCollisioniMarker, 50);
}

// ═══════════════════════════════════════════════
// ANTI-COLLISIONE MARKER (no cluster: pillole sempre leggibili)
// Quando due POI sono fisicamente vicini (es. nasoni/wifi a 134m),
// a certi livelli di zoom le loro pillole si sovrappongono in pixel
// e una copre i click sull'altra. Qui calcoliamo la posizione reale
// a SCHERMO di ogni marker e, se due bounding box si toccano,
// applichiamo un piccolo offset verticale via CSS transform al div
// dell'icona — solo visivo: le coordinate geografiche del marker
// Leaflet restano quelle vere (click, linea di collegamento e
// centratura mappa continuano a puntare al punto corretto).
// Si ricalcola su ogni cambio di zoom/pan, quindi resta valido
// indipendentemente da quanto si è vicini/lontani.
function risolviCollisioniMarker() {
  if (!map) return;
  const entries = Object.values(markers);
  if (entries.length < 2) return;

  const boxes = entries.map(function(entry) {
    const poi = entry.poi;
    const label = getMarkerLabel(poi);
    const w = calcolaLarghezzaMarker(label);
    const h = 36;
    const pt = map.latLngToContainerPoint([poi.lat, poi.lon]);
    // Il marker è ancorato al centro (iconAnchor:[w/2,36]) quindi il
    // punto pt corrisponde al centro-basso della pillola.
    return {
      entry: entry,
      w: w, h: h,
      cx: pt.x, cy: pt.y - h/2,
      offsetY: 0
    };
  });

  // Reset offset precedenti prima di ricalcolare
  boxes.forEach(function(b) {
    const el = b.entry.marker.getElement();
    if (el) {
      const inner = el.querySelector('.marker-wrap');
      if (inner) inner.style.transform = '';
    }
  });

  // Confronto a coppie: se sovrapposte, spostiamo la seconda verso il basso
  for (let i = 0; i < boxes.length; i++) {
    for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i], b = boxes[j];
      const overlapX = Math.abs(a.cx - b.cx) < (a.w + b.w) / 2 - 8;
      const overlapY = Math.abs((a.cy + a.offsetY) - (b.cy + b.offsetY)) < a.h;
      if (overlapX && overlapY) {
        b.offsetY += a.h + 6;
      }
    }
  }

  boxes.forEach(function(b) {
    if (b.offsetY !== 0) {
      const el = b.entry.marker.getElement();
      if (el) {
        const inner = el.querySelector('.marker-wrap');
        if (inner) inner.style.transform = 'translateY(' + b.offsetY + 'px)';
      }
    }
  });
}

// ═══════════════════════════════════════════════
// SCHEDA POI
// ═══════════════════════════════════════════════
// ── HAVERSINE ──
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function formatDist(m){
  if(m<1000) return m+'m';
  return (m/1000).toFixed(1).replace('.',',')+'km';
}

function apriSheet(poiOriginale) {
  var poi = getPoiTradotto(poiOriginale);
  poiSelezionato = poiOriginale;
  document.getElementById('s-emoji').textContent = poi.emoji;
  document.getElementById('s-cat').textContent   = poi.cat;
  document.getElementById('s-name').textContent  = poi.nome;
  document.getElementById('s-desc').textContent  = poi.desc;
  document.getElementById('s-meta').innerHTML    =
    poi.badges.map(b=>`<span class="sheet-badge badge-${b.c}">${b.t}</span>`).join('');

  // Distanza dall utente
  const distEl = document.getElementById('s-dist');
  if(userLat && userLon){
    const d = haversine(userLat,userLon,poi.lat,poi.lon);
    distEl.textContent = '📍 '+formatDist(d)+' '+i18nGetSv('sv_dist_da_te','da te');
    distEl.style.display='inline-block';
    // Colore in base alla distanza
    if(d<=300){
      distEl.style.background='#EAF5EE';distEl.style.color='#1A7A3A';distEl.style.borderColor='rgba(26,122,58,.2)';
    } else if(d<=1000){
      distEl.style.background='#FDF3DC';distEl.style.color='#C8860A';distEl.style.borderColor='rgba(200,134,10,.2)';
    } else {
      distEl.style.background='#FDF0EF';distEl.style.color='#8B1A1A';distEl.style.borderColor='rgba(139,26,26,.2)';
    }
  } else {
    distEl.style.display='none';
  }

  document.getElementById('poi-sheet').classList.add('open');
  map.panTo([poi.lat, poi.lon], {animate:true, duration:.5});

  // Linea retta + label distanza
  if (lineaRetta) { map.removeLayer(lineaRetta); lineaRetta = null; }
  if (distMarker) { map.removeLayer(distMarker); distMarker = null; }
  if (userLat && userLon) {
    lineaRetta = L.polyline(
      [[userLat, userLon], [poi.lat, poi.lon]],
      { color:'#E8A020', weight:3, opacity:.85, dashArray:'8,6', lineCap:'round' }
    ).addTo(map);
    const midLat = (userLat + poi.lat) / 2;
    const midLon = (userLon + poi.lon) / 2;
    const distM  = haversine(userLat, userLon, poi.lat, poi.lon);
    const distTxt = distM < 1000 ? Math.round(distM) + ' m' : (distM/1000).toFixed(1) + ' km';
    distMarker = L.marker([midLat, midLon], {
      icon: L.divIcon({
        className: 'dist-badge-icon',
        html: '<div style="background:#fff;color:#1A4A9F;font-size:18px;font-weight:800;padding:8px 20px;border-radius:12px;border:3px solid #1A4A9F;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.35);letter-spacing:.02em;">↔ ' + distTxt + '</div>',
        iconSize: null,
        iconAnchor: [55, 20]
      }),
      interactive: false
    }).addTo(map);
    setTimeout(function(){ map.fitBounds(lineaRetta.getBounds(), {padding:[70,70]}); }, 400);
  }
}

function chiudiSheet() {
  document.getElementById('poi-sheet').classList.remove('open');
  poiSelezionato = null;
  if (lineaRetta) { map.removeLayer(lineaRetta); lineaRetta = null; }
  if (distMarker) { map.removeLayer(distMarker); distMarker = null; }
}

// Bottone "← Indietro" della topbar: usa lo stack di navigazione
// (navStack). Se c'è una scheda POI aperta, la chiude e fa il pop
// dell'ultima vista nello stack (es. la lista da cui veniva). Se lo
// stack è vuoto, semplicemente esce verso index.html.
function gestisciIndietro() {
  if (poiSelezionato) {
    chiudiSheet();
    const precedente = navStack.pop();
    if (precedente && precedente.vista === 'lista') {
      apriListaCategoria(precedente.tipo, precedente.lista, precedente.meta);
    } else if (precedente && precedente.vista === 'menu-pubblico') {
      apriMenuSottoservizi(window._tuttiPOI || POIS);
    }
    return false;
  }

  if (document.getElementById('cat-list-panel').classList.contains('open')) {
    const precedente = navStack.pop();
    if (precedente && precedente.vista === 'menu-pubblico') {
      apriMenuSottoservizi(window._tuttiPOI || POIS);
      return false;
    }
    document.getElementById('cat-list-panel').classList.remove('open');
    document.querySelectorAll('.filtro').forEach(b => b.classList.remove('active','active-ocra'));
    filtroAttivo = null;
    Object.values(markers).forEach(({marker}) => {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    });
    markers = {};
    return false; // torna alla mappa, pulita
  }

  window.location.href = 'index.html';
  return false;
}

// ═══════════════════════════════════════════════
// PORTAMI QUI
// ═══════════════════════════════════════════════
function portaMiQui() {
  if(!poiSelezionato) return;
  const dest = poiSelezionato.dest;
  let url;
  if(userLat && userLon) {
    // Con posizione utente — percorso da → a
    url = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${dest}&travelmode=walking`;
  } else {
    // Senza GPS — apre solo la destinazione
    url = `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking`;
  }
  window.open(url, '_blank');
}

// ═══════════════════════════════════════════════
// FILTRI
// ═══════════════════════════════════════════════
// Categorie che, una volta filtrate, mostrano una LISTA verticale
// ordinata per distanza invece di marker sparsi sulla mappa —
// più leggibile quando ci sono molti POI vicini tra loro (bancomat,
// poste, fermate bus/taxi/metro, agenzie).
const CATEGORIE_LISTA = ['iconico', 'bancomat', 'poste', 'bus', 'taxi', 'metro', 'agenzia'];

const META_CATEGORIE_LISTA = {
  iconico:  { emoji:'🛍', titolo:'Luoghi iconici' },
  bancomat: { emoji:'🏦', titolo:'Bancomat' },
  poste:    { emoji:'📮', titolo:'Uffici postali' },
  bus:      { emoji:'🚌', titolo:'Bus & Tram' },
  taxi:     { emoji:'🚕', titolo:'Taxi' },
  metro:    { emoji:'🚇', titolo:'Metro' },
  agenzia:  { emoji:'✈️', titolo:'Agenzie viaggio' }
};

// "Servizi pubblici" ha un livello in più: cliccando il filtro si apre
// prima un MENU di sotto-servizi (Nasoni, Prese elettriche, WiFi, Bagni),
// e solo cliccando una di queste righe si apre la lista vera e propria
// dei punti specifici di quel sotto-servizio, ordinata per distanza.
const SOTTOSERVIZI_PUBBLICO = [
  { id:'nasoni',  emoji:'💧', titolo:'Nasoni',           match: p => p.tipo === 'pubblico' && (p.id === 'nasoni' || p.id.startsWith('nasone-')) },
  { id:'presa',   emoji:'🔌', titolo:'Prese elettriche', match: p => p.tipo === 'pubblico' && p.id.startsWith('presa-') },
  { id:'wifi',    emoji:'📶', titolo:'WiFi pubblico',    match: p => p.tipo === 'pubblico' && p.id === 'wifi' },
  { id:'bagni',   emoji:'🚻', titolo:'Bagni pubblici',   match: p => p.tipo === 'bagni' }
];

function filtra(tipo, btn) {
  filtroAttivo = tipo;
  navStack = [];
  document.querySelectorAll('.filtro').forEach(b => {
    b.classList.remove('active','active-ocra');
  });
  btn.classList.add(tipo === 'iconico' ? 'active-ocra' : 'active');

  // Rimuovi tutti i marker esistenti
  Object.values(markers).forEach(({marker}) => {
    if (map.hasLayer(marker)) map.removeLayer(marker);
  });
  markers = {};
  chiudiSheet();

  const allPOI = window._tuttiPOI || POIS;

  if (tipo === 'pubblico') {
    chiudiListaCategoria(true);
    apriMenuSottoservizi(allPOI);
    return;
  }

  if (CATEGORIE_LISTA.includes(tipo)) {
    chiudiListaCategoria(true);
    apriListaCategoria(tipo, allPOI.filter(p => p.tipo === tipo));
    return;
  }

  chiudiListaCategoria(true);

  if (tipo === 'tutti') {
    // Mostra solo il più vicino per ogni tipo
    const tipi = [...new Set(allPOI.map(p => p.tipo))];
    tipi.forEach(function(t) {
      const delTipo = allPOI.filter(p => p.tipo === t);
      delTipo.sort(function(a, b) {
        if (!userLat) return 0;
        return haversine(userLat, userLon, a.lat, a.lon) - haversine(userLat, userLon, b.lat, b.lon);
      });
      if (delTipo.length > 0) addMarker(delTipo[0]);
    });
  } else {
    // Mostra TUTTI i POI del tipo selezionato
    allPOI.filter(p => p.tipo === tipo).forEach(addMarker);
  }

  setTimeout(risolviCollisioniMarker, 50);
}

// ═══════════════════════════════════════════════
// PANNELLO LISTA CATEGORIA
// ═══════════════════════════════════════════════
function apriListaCategoria(tipo, poiList, metaCustom) {
  const meta = metaCustom || META_CATEGORIE_LISTA[tipo] || { emoji:'📍', titolo:tipo };

  // Ordina per distanza crescente dal pin utente
  const ordinati = poiList.slice().sort(function(a, b) {
    if (!userLat) return 0;
    return haversine(userLat, userLon, a.lat, a.lon) - haversine(userLat, userLon, b.lat, b.lon);
  });

  document.getElementById('cl-emoji').textContent = meta.emoji;
  document.getElementById('cl-titolo').textContent = meta.titolo;
  document.getElementById('cl-count').textContent = ordinati.length;

  const body = document.getElementById('cl-body');
  body.innerHTML = ordinati.map(function(poiOriginale) {
    const poi = getPoiTradotto(poiOriginale);
    const distTxt = userLat
      ? formatDist(haversine(userLat, userLon, poi.lat, poi.lon))
      : '—';
    return '<div class="cat-list-row" onclick="selezionaDaLista(\'' + poiOriginale.id + '\')">' +
      '<div class="cat-list-emoji">' + poi.emoji + '</div>' +
      '<div class="cat-list-info">' +
        '<div class="cat-list-nome">' + poi.nome + '</div>' +
        '<div class="cat-list-sub">' + poi.cat + '</div>' +
      '</div>' +
      '<div class="cat-list-dist">' + distTxt + '</div>' +
    '</div>';
  }).join('');

  document.getElementById('cat-list-panel').classList.add('open');
}

// Menu intermedio per "Servizi pubblici": mostra le sotto-categorie
// (Nasoni, Prese elettriche, WiFi, Bagni) come righe cliccabili,
// ognuna con il conteggio dei punti disponibili. Cliccando una riga
// si apre la lista vera e propria di quel sotto-servizio.
function apriMenuSottoservizi(allPOI) {
  document.getElementById('cl-emoji').textContent = '💧';
  document.getElementById('cl-titolo').textContent = 'Servizi pubblici';
  document.getElementById('cl-count').textContent = allPOI.filter(p => p.tipo === 'pubblico' || p.tipo === 'bagni').length;

  const body = document.getElementById('cl-body');
  body.innerHTML = SOTTOSERVIZI_PUBBLICO.map(function(sotto) {
    const n = allPOI.filter(sotto.match).length;
    return '<div class="cat-list-row" onclick="apriSottoservizio(\'' + sotto.id + '\')">' +
      '<div class="cat-list-emoji">' + sotto.emoji + '</div>' +
      '<div class="cat-list-info">' +
        '<div class="cat-list-nome">' + sotto.titolo + '</div>' +
      '</div>' +
      '<div class="cat-list-dist">' + n + '</div>' +
    '</div>';
  }).join('');

  document.getElementById('cat-list-panel').classList.add('open');
}

function apriSottoservizio(sottoId) {
  const sotto = SOTTOSERVIZI_PUBBLICO.find(s => s.id === sottoId);
  if (!sotto) return;
  const allPOI = window._tuttiPOI || POIS;
  // Metto sullo stack il menu sotto-servizi da cui arrivo, così
  // "← Indietro" dalla lista torna al menu, non dritto alla mappa.
  navStack.push({ vista: 'menu-pubblico' });
  apriListaCategoria(sotto.id, allPOI.filter(sotto.match), { emoji: sotto.emoji, titolo: sotto.titolo });
}

function chiudiListaCategoria(senzaResetFiltro) {
  document.getElementById('cat-list-panel').classList.remove('open');
  navStack = [];
  if (!senzaResetFiltro) {
    // Torna alla mappa pulita, nessun filtro evidenziato come attivo —
    // l'utente sceglie di nuovo quale categoria esplorare.
    document.querySelectorAll('.filtro').forEach(b => b.classList.remove('active','active-ocra'));
    filtroAttivo = null;
    Object.values(markers).forEach(({marker}) => {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    });
    markers = {};
  }
}

function selezionaDaLista(poiId) {
  const allPOI = window._tuttiPOI || POIS;
  const poi = allPOI.find(p => p.id === poiId);
  if (!poi) return;

  // Se il POI appartiene a un sotto-servizio di "pubblico" (nasoni,
  // prese, wifi, bagni), rimetto nello stack la lista di QUEL
  // sotto-servizio specifico, non l'intero tipo:'pubblico' mescolato.
  const sottoServizio = SOTTOSERVIZI_PUBBLICO.find(s => s.match(poi));
  if (sottoServizio) {
    navStack.push({
      vista: 'lista',
      tipo: sottoServizio.id,
      lista: allPOI.filter(sottoServizio.match),
      meta: { emoji: sottoServizio.emoji, titolo: sottoServizio.titolo }
    });
  } else {
    // Prima di aprire la scheda, metto sullo stack la vista "lista" da
    // cui arrivo, così "← Indietro" sa di doverci tornare.
    navStack.push({ vista: 'lista', tipo: poi.tipo, lista: allPOI.filter(p => p.tipo === poi.tipo) });
  }

  document.getElementById('cat-list-panel').classList.remove('open');
  // Assicura che il marker di questo POI sia presente sulla mappa
  // (necessario perché apriSheet/panTo si aspettano la mappa pronta)
  if (!markers[poi.id]) addMarker(poi);
  apriSheet(poi);
}

// ═══════════════════════════════════════════════
// GPS
// ═══════════════════════════════════════════════
function startGPS() {
  if(!navigator.geolocation) {
    // Fallback: centra su Roma
    initMappa(41.9028, 12.4964);
    document.getElementById('gps-label').textContent = i18nGetSv('sv_gps_nd', 'GPS non disponibile');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => initMappa(pos.coords.latitude, pos.coords.longitude),
    () => {
      // Fallback Roma centro
      initMappa(41.9028, 12.4964);
      document.getElementById('gps-label').textContent = i18nGetSv('sv_gps_default', 'Roma (default)');
    },
    {enableHighAccuracy:true, timeout:8000, maximumAge:0}
  );

  // Aggiornamento continuo posizione
  navigator.geolocation.watchPosition(pos => {
    const {latitude:lat, longitude:lon} = pos.coords;
    userLat = lat; userLon = lon;
    if(userMarker) userMarker.setLatLng([lat,lon]);
  }, null, {enableHighAccuracy:true});
}

// Chiudi sheet cliccando sulla mappa
document.getElementById('map').addEventListener('click', e => {
  if(e.target.id === 'map') chiudiSheet();
});

// Swipe down per chiudere sheet
let touchStartY = 0;
document.getElementById('poi-sheet').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
});
document.getElementById('poi-sheet').addEventListener('touchend', e => {
  if(e.changedTouches[0].clientY - touchStartY > 60) chiudiSheet();
});

startGPS();
applyI18nDOMServizi();

window.addEventListener('storage', function() {
  applyI18nDOMServizi();
  syncLangSwitchDisplay(localStorage.getItem('it_lang') || 'it');
  refreshMarkerLabels();
});
const _origApplyLangSv = window.applyLang;
if (typeof _origApplyLangSv === 'function') {
  window.applyLang = function(lang) { _origApplyLangSv(lang); applyI18nDOMServizi(); syncLangSwitchDisplay(lang); refreshMarkerLabels(); };
}
