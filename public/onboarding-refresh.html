<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstantTown — Sessione scaduta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--rosso:#8B1A1A;--rosso-l:#C0392B;--ocra:#C8860A;--ocra-l:#E8A020;--cielo:#4A90C4;--cielo-l:#6AAFD8;--bianco:#FDFAF4;--sfondo-pagina:#E8C0AE;--ink:#1C1410;--ink-mu:#6B5A4E;--rule:rgba(139,26,26,0.12);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--sfondo-pagina);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;}
.stripe{height:5px;background:linear-gradient(90deg,var(--rosso-l) 33.3%,#fff 33.3%,#fff 66.6%,var(--cielo) 66.6%);position:fixed;top:0;left:0;right:0;}
.card{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:40px 32px;width:100%;max-width:440px;box-shadow:0 4px 32px rgba(28,20,16,.08);text-align:center;}
.icon{font-size:48px;margin-bottom:16px;}
.title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--ink);margin-bottom:10px;}
.body{font-size:14px;color:var(--ink-mu);line-height:1.7;margin-bottom:28px;}
.btn{display:inline-block;background:var(--cielo);color:#fff;padding:13px 28px;border-radius:4px;text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.04em;}
.btn:hover{background:var(--cielo-l);}
</style>
</head>
<body>
<div class="stripe"></div>
<div class="card">
  <div class="icon">⏳</div>
  <h1 class="title">Il link è scaduto</h1>
  <p class="body">
    Il link di onboarding aveva una validità limitata ed è scaduto.<br>
    Torna alla registrazione per richiederne uno nuovo.
  </p>
  <a href="registrazione.html" class="btn">Torna alla registrazione</a>
</div>
</body>
</html>
